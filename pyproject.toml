[project]
name = "crew"
version = "0.1.0"
description = "ai-trading-crew using crewAI"
authors = [{ name = "Antigravity", email = "antigravity@gemini.google.com" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "crewai[tools]",
    "onnxruntime",
    "numpy<2",
    "yfinance",
    "pandas-datareader",
    "pandas-market-calendars",
    "pandas<2.0.0",
    "nixtla",
    "matplotlib",
    "ta-lib",
    "linkup-sdk",
    "crawl4ai",
    "openpyxl",
    "requests",
    "seaborn",
    "yahooquery",
    "setuptools",
    "markdown",
    "torch",
    "einops",
    "huggingface_hub",
    "safetensors",
    "pyarrow",
    "chronos-forecasting",
    "transformers",
    "accelerate",
    "duckdb>=1.2,<2",
    "pyyaml>=6,<7",
    "python-dotenv>=1,<2",
    "pytest>=8,<9",
    "pydantic>=2.13.4,<3",
]

[dependency-groups]
dev = [
    "prek==0.4.10",
    "pyrefly==1.1.1",
    "ruff==0.16.0",
]

[project.scripts]
crew = "crew.main:run"
run_crew = "crew.main:run"
train = "crew.main:train"
replay = "crew.main:replay"
test = "crew.main:test"
crew-data = "crew.data_platform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "docs", "output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pyrefly]
python-version = "3.11"
project-includes = ["crew/data_platform/config_schema.py"]
project-excludes = ["docs", "output", "data"]
