name: Build, audit, and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "output/use_cases/**"
      - "config/use_case_data_status.yaml"
      - "scripts/check_pages.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit to build and deploy; defaults to the dispatch event SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}

      - name: Verify source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test -n "$EXPECTED_SOURCE_SHA"
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          echo "Pages source identity verified: $actual"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Build and audit canonical Pages output
        run: bash scripts/check_pages.sh

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-and-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
