name: Fast quality gates

on:
  pull_request:
    paths:
      - "crew/**"
      - "web/**"
      - "tests/**"
      - "config/**"
      - "Taskfile.yaml"
      - "resources/reference/canonical-flow.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".gitignore"
      - ".pre-commit-config.yaml"
      - "scripts/bootstrap.sh"
      - "scripts/check.sh"
      - ".github/workflows/quality.yml"
  push:
    branches: [main]
    paths:
      - "crew/**"
      - "web/**"
      - "tests/**"
      - "config/**"
      - "Taskfile.yaml"
      - "resources/reference/canonical-flow.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".gitignore"
      - ".pre-commit-config.yaml"
      - "scripts/bootstrap.sh"
      - "scripts/check.sh"
      - ".github/workflows/quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.11"
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Verify Ruff formatting
        run: uv run --locked ruff format --check --output-format github crew/data_platform crew/yields web tests/data_platform

      - name: Run Ruff lint
        run: uv run --locked ruff check --output-format github crew/data_platform crew/yields web tests/data_platform

      - name: Run Pyrefly
        run: uv run --locked pyrefly check

      - name: Run data-platform tests
        run: uv run --locked pytest tests/data_platform -q

      - name: Verify JavaScript syntax
        run: node --check web/static/site.js
