name: Validate canonical data platform

on:
  pull_request:
    paths:
      - "crew/data_platform/**"
      - "crew/yields/**"
      - "crew/oracle/**"
      - "crew/legendary_investors/**"
      - "config/data_platform.yaml"
      - "config/use_case_data_status.yaml"
      - "config/use_cases/yields.yaml"
      - "config/use_cases/oracle.yaml"
      - "config/use_cases/legendary_investors.yaml"
      - "tests/data_platform/**"
      - "docs/data-platform.md"
      - "pyproject.toml"
      - "Taskfile.yaml"
      - ".github/workflows/data-platform.yml"
  push:
    branches: [main]
    paths:
      - "crew/data_platform/**"
      - "crew/yields/**"
      - "crew/oracle/**"
      - "crew/legendary_investors/**"
      - "config/data_platform.yaml"
      - "config/use_case_data_status.yaml"
      - "config/use_cases/yields.yaml"
      - "config/use_cases/oracle.yaml"
      - "config/use_cases/legendary_investors.yaml"
      - "tests/data_platform/**"
      - "pyproject.toml"
      - "Taskfile.yaml"
      - ".github/workflows/data-platform.yml"
  workflow_dispatch:
    inputs:
      live_sync:
        description: Fetch primary sources and publish the sanitized status
        type: boolean
        default: true
  schedule:
    - cron: "17 5 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

concurrency:
  group: data-platform-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Compile platform and active analyses
        run: |
          uv run python -m compileall -q \
            crew/data_platform crew/yields crew/oracle \
            crew/legendary_investors tests/data_platform

      - name: Validate source registry
        run: uv run crew-data validate-config

      - name: Run offline contracts
        run: uv run pytest tests/data_platform -q

      - name: Exercise credential-free registry ingestion
        run: |
          uv run crew-data --root /tmp/crewtrade-platform sync --source governed_manual
          uv run crew-data --root /tmp/crewtrade-platform export-status \
            --output /tmp/crewtrade-public-status.json

  live-snapshot:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.live_sync)
    needs: contracts
    runs-on: macos-15
    env:
      SEC_USER_AGENT: CrewTrade 137051370+KAFKA2306@users.noreply.github.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Fetch nominal and real U.S. Treasury curves
        run: uv run crew-data sync --source treasury_yield_curve

      - name: Fetch SEC filings, facts, and 13F tables
        run: uv run crew-data sync --source sec_edgar

      - name: Materialize governed source registry
        run: uv run crew-data sync --source governed_manual

      - name: Generate active analysis reports
        run: |
          uv run python -m crew.yields.data_pipeline
          uv run python -m crew.yields.analysis
          uv run python -m crew.oracle.data_pipeline
          uv run python -m crew.oracle.analysis
          uv run python -m crew.legendary_investors.data_pipeline
          uv run python -m crew.legendary_investors.analysis

      - name: Export sanitized Pages status
        run: uv run crew-data export-status

      - name: Require public status OK
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          path = Path("web/generated/data-platform-status.json")
          status = json.loads(path.read_text(encoding="utf-8"))
          assert status["overall_status"] == "ok", status
          assert status["summary"]["canonical_ok"] == 3, status["summary"]
          assert status["summary"]["controlled_blocks"] == 7, status["summary"]
          assert status["summary"]["awaiting_snapshot"] == 0, status["summary"]
          print("Canonical Pages status is OK")
          PY

      - name: Show ingestion state
        run: uv run crew-data status

      - name: Upload canonical smoke-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: crewtrade-canonical-smoke-${{ github.run_id }}
          path: |
            data/platform
            web/generated/data-platform-status.json
            output/use_cases/yield_spread
            output/use_cases/oracle
            output/use_cases/legendary_investors
          retention-days: 30
          if-no-files-found: error

      - name: Publish reports and status on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/generated/data-platform-status.json output/use_cases
          if git diff --cached --quiet; then
            echo "Published reports and status are current."
          else
            git commit -m "Refresh canonical data reports and status"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
