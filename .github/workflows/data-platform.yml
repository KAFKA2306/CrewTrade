name: Validate canonical data platform

on:
  pull_request:
    paths:
      - "crew/data_platform/**"
      - "crew/yields/**"
      - "crew/oracle/**"
      - "crew/legendary_investors/**"
      - "config/data_platform.yaml"
      - "config/use_case_data_status.yaml"
      - "config/use_cases/yields.yaml"
      - "config/use_cases/oracle.yaml"
      - "config/use_cases/legendary_investors.yaml"
      - "tests/data_platform/**"
      - "docs/data-platform.md"
      - "pyproject.toml"
      - "Taskfile.yaml"
      - "scripts/check_pages.sh"
      - ".github/workflows/data-platform.yml"
  push:
    branches: [main]
    paths:
      - "crew/data_platform/**"
      - "crew/yields/**"
      - "crew/oracle/**"
      - "crew/legendary_investors/**"
      - "config/data_platform.yaml"
      - "config/use_case_data_status.yaml"
      - "config/use_cases/yields.yaml"
      - "config/use_cases/oracle.yaml"
      - "config/use_cases/legendary_investors.yaml"
      - "tests/data_platform/**"
      - "pyproject.toml"
      - "Taskfile.yaml"
      - "scripts/check_pages.sh"
      - ".github/workflows/data-platform.yml"
  workflow_dispatch:
    inputs:
      live_sync:
        description: Fetch reachable primary sources and publish the sanitized status
        type: boolean
        default: true
  schedule:
    - cron: "17 5 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write
  actions: write

concurrency:
  group: data-platform-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Compile platform and analyses
        run: |
          uv run python -m compileall -q \
            crew/data_platform crew/yields crew/oracle \
            crew/legendary_investors tests/data_platform

      - name: Validate source registry
        run: uv run crew-data validate-config

      - name: Run offline contracts
        run: uv run pytest tests/data_platform -q

      - name: Exercise credential-free registry ingestion
        run: |
          uv run crew-data --root /tmp/crewtrade-platform sync --source governed_manual
          uv run crew-data --root /tmp/crewtrade-platform export-status \
            --output /tmp/crewtrade-public-status.json

  live-snapshot:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.live_sync)
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Fetch nominal and real U.S. Treasury curves
        run: uv run crew-data sync --source treasury_yield_curve

      - name: Materialize governed source registry
        run: uv run crew-data sync --source governed_manual

      - name: Generate active analysis report
        run: |
          uv run python -m crew.yields.data_pipeline
          uv run python -m crew.yields.analysis

      - name: Bind active report to canonical lineage
        run: |
          report="$(find output/use_cases/yield_spread -type f -name report.md | sort | tail -1)"
          test -n "$report"
          evidence="${report%/report.md}/evidence.json"
          summary="${report%/report.md}/evidence-summary.html"
          uv run crew-data evidence-pack \
            --use-case yield_spread \
            --report "$report" \
            --output "$evidence" \
            --summary-output "$summary"
          uv run python - "$evidence" "$summary" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          rendered = Path(sys.argv[2]).read_text(encoding="utf-8")
          assert payload["decision"] == "READY_FOR_REVIEW", payload
          assert payload["report"]["sha256"], payload
          assert payload["evidence_fingerprint"], payload
          assert payload["evidence_fingerprint"] in rendered
          print(f"Evidence pack READY_FOR_REVIEW: {payload['evidence_fingerprint']}")
          PY

      - name: Export sanitized Pages status
        run: uv run crew-data export-status

      - name: Require public status OK
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          path = Path("web/generated/data-platform-status.json")
          status = json.loads(path.read_text(encoding="utf-8"))
          assert status["overall_status"] == "ok", status
          assert status["summary"]["canonical_ok"] == 1, status["summary"]
          assert status["summary"]["controlled_blocks"] == 9, status["summary"]
          assert status["summary"]["awaiting_snapshot"] == 0, status["summary"]
          print("Canonical Pages status is OK")
          PY

      - name: Verify generated state through the canonical Pages flow
        run: bash scripts/check_pages.sh

      - name: Show ingestion state
        run: uv run crew-data status

      - name: Upload canonical smoke-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: crewtrade-canonical-smoke-${{ github.run_id }}
          path: |
            data/platform
            web/generated/data-platform-status.json
            output/use_cases/yield_spread
            docs
          retention-days: 30
          if-no-files-found: error

      - name: Publish report and status on main
        id: publish
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/generated/data-platform-status.json output/use_cases/yield_spread
          if git diff --cached --quiet; then
            echo "Published report and status are current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh canonical data report and status"
            git stash push --include-untracked -m "ci-smoke-generated"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch Pages after canonical data publish
        if: github.ref == 'refs/heads/main' && steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches"
