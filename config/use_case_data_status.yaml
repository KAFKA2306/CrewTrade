schema_version: 1
allowed_controlled_states:
  - canonical_active
  - governed_blocked
  - governed_partial
  - private_input_required
use_cases:
  credit:
    title: クレジット・スプレッド
    state: governed_blocked
    required_contracts: [ice_bofa_oas]
    owner_source: ICE Data Indices / FRED
    note: ETF代理系列は廃止済み。ICE BofA OASは公開再配布権を確認できるまで数値更新を停止。
  yield_spread:
    title: 金利・イールドスプレッド
    state: canonical_active
    required_datasets: [rates_macro, treasury_par_yield_curve, treasury_par_real_yield_curve]
    owner_source: U.S. Department of the Treasury
    note: 名目・実質カーブと両者から導出する10年期待インフレを分離。
  oracle:
    title: Oracle実績・予測監査
    state: governed_blocked
    required_contracts: [sec_edgar_external_runner]
    owner_source: SEC EDGAR
    note: 静的実績値は廃止済み。data.sec.govがGitHub-hosted runnerを403拒否するため、到達可能な外部実行基盤を検証するまで自動数値更新を停止。
  legendary_investors:
    title: 著名投資家リサーチ
    state: governed_blocked
    required_contracts: [sec_edgar_external_runner]
    owner_source: SEC EDGAR 13F
    note: 固定銘柄配列は廃止済み。13F information tableは到達可能な外部実行基盤を検証するまで自動数値更新を停止。
  imura:
    title: ファンド・指数比較
    state: governed_blocked
    required_contracts: [fundnote_kaihou]
    owner_source: fundnote株式会社
    note: 公式機械可読NAV契約が整うまで数値更新を停止。
  index_7_portfolio:
    title: 7指数ポートフォリオ
    state: governed_blocked
    required_contracts: [jpx_etf_master]
    owner_source: JPX / 各運用会社
    note: 正式商品マスターと指数代替系列の整備待ち。
  index_etf_comparison:
    title: 指数ETF比較
    state: governed_blocked
    required_contracts: [jpx_etf_master, edinet_api_v2]
    owner_source: JPX / EDINET
    note: ISIN・正式指数・通貨・費用を揃えた商品契約待ち。
  precious_metals_spread:
    title: 貴金属スプレッド
    state: governed_blocked
    required_contracts: [lbma_benchmarks]
    owner_source: LBMA
    note: 履歴保存・再配布ライセンスが整うまで日次シグナル停止。
  securities_collateral_loan:
    title: 証券担保ローン
    state: private_input_required
    required_contracts: [broker_collateral_contract]
    owner_source: 非公開契約・口座状態
    note: 公開Pagesへ契約・口座値を出さず、入力状態だけ表示。
  semiconductors:
    title: 半導体サイクル
    state: governed_partial
    required_contracts: [wsts_market_data, edinet_api_v2]
    owner_source: WSTS / EDINET / 企業開示
    note: 公開リリースは利用可能、会員表と企業XBRLは追加契約待ち。
