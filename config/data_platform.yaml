schema_version: 2
storage:
  root: data/platform
  canonical_timezone: UTC

sources:
  fred:
    adapter: fred
    enabled: false
    api_key_env: FRED_API_KEY
    user_agent: CrewTrade data-platform
    min_interval_seconds: 0.25
    timeout_seconds: 60
    max_attempts: 3
    datasets: {}

  treasury_yield_curve:
    adapter: treasury_yield_curve
    enabled: true
    user_agent: CrewTrade data-platform
    min_interval_seconds: 0.5
    timeout_seconds: 60
    max_attempts: 3
    dataset: treasury_par_yield_curve
    real_dataset: treasury_par_real_yield_curve
    rates_dataset: rates_macro
    years: [2024, 2025, 2026]

  sec_edgar:
    adapter: sec
    enabled: false
    user_agent_env: SEC_USER_AGENT
    min_interval_seconds: 0.15
    entities:
      oracle:
        cik: "1341439"
        companyfacts: true
      soros_fund_management:
        cik: "1029160"
        companyfacts: false
        thirteen_f_information_table: true
        history_limit: 2
      duquesne_family_office:
        cik: "1536411"
        companyfacts: false
        thirteen_f_information_table: true
        history_limit: 2

  governed_manual:
    adapter: governed_manual
    enabled: true
    registry_url: https://github.com/KAFKA2306/CrewTrade/blob/main/config/data_platform.yaml
    datasets:
      sec_edgar_external_runner:
        use_cases: [oracle, legendary_investors]
        owner: U.S. Securities and Exchange Commission
        source_url: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
        access_mode: official_api_external_runner
        license_status: public_api_fair_access
        refresh_policy: daily_after_runner_validation
        required_fields: [declared_user_agent, reachable_runner, raw_sha256, retrieved_at]
        automation_status: blocked
        block_reason: data.sec.gov returned HTTP 403 from both Linux and macOS GitHub-hosted runners despite a declared contact User-Agent. SEC ingestion remains disabled on Pages CI until a compliant reachable self-hosted or persistent runner is validated.
        checked_on: "2026-08-05"
      ice_bofa_oas:
        use_cases: [credit]
        owner: ICE Data Indices, LLC / FRED
        source_url: https://fred.stlouisfed.org/data/BAMLC0A0CM
        access_mode: licensed_third_party_index_data
        license_status: internal_use_only_no_public_redistribution
        refresh_policy: after_recorded_license
        required_fields: [series_id, observation_date, value, license_scope]
        automation_status: blocked
        block_reason: FRED states ICE BofA Top Level Data is for internal use only and may not be published or furnished to third parties without prior approval.
        checked_on: "2026-08-04"
      fundnote_kaihou:
        use_cases: [imura]
        owner: fundnote株式会社
        source_url: https://www.fundnote.co.jp/fund/kaihou/
        access_mode: official_document
        license_status: public_reference_only
        refresh_policy: monthly_or_material_event
        required_fields: [nav_date, nav, distribution, fee_revision, purchase_status]
        automation_status: blocked
        block_reason: Machine-readable official NAV history endpoint not yet contracted.
        checked_on: "2026-08-04"
      jpx_etf_master:
        use_cases: [index_etf_comparison, index_7_portfolio, securities_collateral_loan]
        owner: 株式会社日本取引所グループ
        source_url: https://www.jpx.co.jp/equities/products/etfs/issues/index.html
        access_mode: official_document
        license_status: terms_review_required
        refresh_policy: daily_metadata_monthly_full
        required_fields: [ticker, isin, official_name, index_name, currency, hedge, fee, inception_date]
        automation_status: blocked
        block_reason: Product master and market data redistribution terms must be recorded before ingestion.
        checked_on: "2026-08-04"
      edinet_api_v2:
        use_cases: [index_etf_comparison, semiconductors, oracle]
        owner: 金融庁
        source_url: https://disclosure2dl.edinet-fsa.go.jp/guide/static/disclosure/WEEK0060.html
        access_mode: official_api
        license_status: public_api_key_required
        refresh_policy: daily
        required_fields: [doc_id, edinet_code, sec_code, form_code, submit_datetime, xbrl_sha256]
        automation_status: ready_requires_adapter_and_secret
        block_reason: EDINET_API_KEY and XBRL normalization adapter are not yet configured.
        checked_on: "2026-08-04"
      lbma_benchmarks:
        use_cases: [precious_metals_spread]
        owner: London Bullion Market Association
        source_url: https://www.lbma.org.uk/prices-and-data/lbma-precious-metal-prices
        access_mode: licensed_benchmark
        license_status: license_required_for_history_and_redistribution
        refresh_policy: daily_after_license
        required_fields: [benchmark, fixing, currency, unit, observation_time, value]
        automation_status: blocked
        block_reason: Historical benchmark storage and redistribution require a recorded license.
        checked_on: "2026-08-04"
      wsts_market_data:
        use_cases: [semiconductors]
        owner: World Semiconductor Trade Statistics
        source_url: https://www.wsts.org/
        access_mode: public_release_plus_member_data
        license_status: mixed
        refresh_policy: monthly_public_release_quarterly_forecast
        required_fields: [vintage_date, period, product_group, geography, value, status]
        automation_status: partial
        block_reason: Public releases can be snapshotted; detailed member tables require access rights.
        checked_on: "2026-08-04"
      broker_collateral_contract:
        use_cases: [securities_collateral_loan]
        owner: user_private
        source_url: https://github.com/KAFKA2306/CrewTrade
        access_mode: private_contract
        license_status: private_not_publishable
        refresh_policy: on_contract_or_collateral_change
        required_fields: [contract_version, valuation_time, ticker, quantity, market_price, collateral_haircut]
        automation_status: private_input_required
        block_reason: Contract and account state must remain outside the public repository.
        checked_on: "2026-08-04"

contracts:
  treasury_par_yield_curve:
    contract_version: 1.0.0
    source: us_treasury
    primary_key: [observation_date, tenor]
    strict_columns: true
    grain: one row per observation date and nominal Treasury tenor
    revision_policy: source revisions are preserved as new ingestion runs
    redistribution: public official source with provenance
    required_metadata: [years, retrieval_mode, point_in_time_vintage, http_request_count, source_urls, curve_type]
    freshness:
      field: observation_date
      max_age_days: 10
    fields:
      observation_date: {type: date, nullable: false}
      tenor:
        type: string
        nullable: false
        allowed: [1M, 1.5M, 2M, 3M, 4M, 6M, 1Y, 2Y, 3Y, 5Y, 7Y, 10Y, 20Y, 30Y]
      value: {type: number, nullable: false, minimum: -10, maximum: 30}
      unit: {type: string, nullable: false, allowed: [percent]}
      curve_type: {type: string, nullable: false, allowed: [daily_treasury_par_yield_curve]}

  treasury_par_real_yield_curve:
    contract_version: 1.0.0
    source: us_treasury
    primary_key: [observation_date, tenor]
    strict_columns: true
    grain: one row per observation date and real Treasury tenor
    revision_policy: source revisions are preserved as new ingestion runs
    redistribution: public official source with provenance
    required_metadata: [years, retrieval_mode, point_in_time_vintage, http_request_count, source_urls, curve_type]
    freshness:
      field: observation_date
      max_age_days: 10
    fields:
      observation_date: {type: date, nullable: false}
      tenor: {type: string, nullable: false, allowed: [5Y, 7Y, 10Y, 20Y, 30Y]}
      value: {type: number, nullable: false, minimum: -10, maximum: 30}
      unit: {type: string, nullable: false, allowed: [percent]}
      curve_type: {type: string, nullable: false, allowed: [daily_treasury_par_real_yield_curve]}

  rates_macro:
    contract_version: 1.0.0
    source: us_treasury
    primary_key: [series_id, observation_date, realtime_start, realtime_end]
    strict_columns: true
    grain: one row per canonical rates series, observation date, and retrieval vintage
    revision_policy: derived breakeven is recomputed from same-date nominal and real observations
    redistribution: public official inputs; derived series formula must remain explicit
    required_metadata: [years, retrieval_mode, point_in_time_vintage, http_request_count, source_urls, derived_series, source_series]
    freshness:
      field: observation_date
      max_age_days: 10
    fields:
      series_id:
        type: string
        nullable: false
        allowed: [TREASURY_NOMINAL_2Y, TREASURY_NOMINAL_10Y, TREASURY_NOMINAL_30Y, TREASURY_REAL_10Y, TREASURY_DERIVED_10Y_BREAKEVEN]
      label:
        type: string
        nullable: false
        allowed: [us_2y, us_10y, us_30y, us_10y_real, us_10y_breakeven]
      observation_date: {type: date, nullable: false}
      value: {type: number, nullable: false, minimum: -20, maximum: 40}
      realtime_start: {type: date, nullable: false}
      realtime_end: {type: date, nullable: false}
      units: {type: string, nullable: false, allowed: [Percent]}
      title: {type: string, nullable: false}

  governed_source_registry:
    contract_version: 1.0.0
    source: governed_manual
    primary_key: [source_id]
    strict_columns: true
    grain: one row per governed external or private source contract
    revision_policy: registry changes require a repository commit
    redistribution: metadata only; source-specific rights are recorded per row
    required_metadata: [registered_sources]
    freshness:
      field: checked_on
      max_age_days: 30
    fields:
      source_id: {type: string, nullable: false}
      use_cases: {type: json, nullable: false}
      owner: {type: string, nullable: false}
      source_url: {type: string, nullable: false, pattern: '^https://.+'}
      access_mode: {type: string, nullable: false}
      license_status: {type: string, nullable: false}
      refresh_policy: {type: string, nullable: false}
      required_fields: {type: json, nullable: false}
      automation_status:
        type: string
        nullable: false
        allowed: [blocked, partial, ready_requires_adapter_and_secret, private_input_required]
      block_reason: {type: string, nullable: false}
      checked_on: {type: date, nullable: false}

  sec_filings:
    contract_version: 1.0.0
    source: sec_edgar
    primary_key: [entity_cik, accession_number]
    strict_columns: true
    grain: one row per SEC entity and accession number
    revision_policy: amended filings remain separate accession numbers
    redistribution: SEC public filing metadata with declared fair-access identity
    required_metadata: [entity_count]
    fields:
      entity_name: {type: string, nullable: false}
      entity_cik: {type: string, nullable: false, pattern: '^\d{10}$'}
      accession_number: {type: string, nullable: false, pattern: '^\d{10}-\d{2}-\d{6}$'}
      filing_date: {type: date, nullable: false}
      report_date: {type: date, nullable: true}
      acceptance_datetime: {type: datetime, nullable: true}
      form: {type: string, nullable: false}
      primary_document: {type: string, nullable: false}
      primary_doc_description: {type: string, nullable: true}
      file_number: {type: string, nullable: true}
      is_xbrl: {type: integer, nullable: true, minimum: 0, maximum: 1}
      is_inline_xbrl: {type: integer, nullable: true, minimum: 0, maximum: 1}

  sec_company_facts:
    contract_version: 1.0.0
    source: sec_edgar
    primary_key: [fact_id]
    strict_columns: true
    grain: one row per canonical SEC company fact observation
    revision_policy: each filed observation is retained and identified by fact_id
    redistribution: SEC public XBRL facts with raw filing provenance
    required_metadata: [entity_count]
    fields:
      fact_id: {type: string, nullable: false, pattern: '^[0-9a-f]{64}$'}
      entity_name: {type: string, nullable: false}
      entity_cik: {type: string, nullable: false, pattern: '^\d{10}$'}
      taxonomy: {type: string, nullable: false}
      concept: {type: string, nullable: false}
      label: {type: string, nullable: true}
      description: {type: string, nullable: true}
      unit: {type: string, nullable: false}
      value: {type: any, nullable: false}
      start_date: {type: date, nullable: true}
      end_date: {type: date, nullable: true}
      filed_date: {type: date, nullable: false}
      form: {type: string, nullable: false}
      fiscal_year: {type: integer, nullable: true, minimum: 1900, maximum: 2200}
      fiscal_period: {type: string, nullable: true}
      frame: {type: string, nullable: true}
      accession_number: {type: string, nullable: false, pattern: '^\d{10}-\d{2}-\d{6}$'}

  sec_13f_holdings:
    contract_version: 1.0.0
    source: sec_edgar
    primary_key: [holding_id]
    strict_columns: true
    grain: one row per 13F information-table holding position
    revision_policy: amendments remain separate accession-number observations
    redistribution: SEC public 13F information table with source-document provenance
    required_metadata: [filing_count]
    fields:
      holding_id: {type: string, nullable: false, pattern: '^[0-9a-f]{64}$'}
      entity_name: {type: string, nullable: false}
      entity_cik: {type: string, nullable: false, pattern: '^\d{10}$'}
      accession_number: {type: string, nullable: false, pattern: '^\d{10}-\d{2}-\d{6}$'}
      report_date: {type: date, nullable: false}
      filing_date: {type: date, nullable: false}
      issuer: {type: string, nullable: false}
      title_of_class: {type: string, nullable: true}
      cusip: {type: string, nullable: false}
      figi: {type: string, nullable: true}
      reported_value: {type: number, nullable: false, minimum: 0}
      reported_value_unit: {type: string, nullable: false, allowed: [SEC_13F_as_filed]}
      shares_or_principal: {type: number, nullable: false, minimum: 0}
      shares_or_principal_type: {type: string, nullable: true}
      put_call: {type: string, nullable: true}
      investment_discretion: {type: string, nullable: true}
      other_manager: {type: string, nullable: true}
      voting_sole: {type: number, nullable: true, minimum: 0}
      voting_shared: {type: number, nullable: true, minimum: 0}
      voting_none: {type: number, nullable: true, minimum: 0}
      source_document_url: {type: string, nullable: false, pattern: '^https://.+'}
