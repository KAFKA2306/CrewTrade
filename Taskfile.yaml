version: "3"

tasks:
  process:all:
    desc: Sync reachable canonical sources, run active analyses, and export Pages status
    cmds:
      - task: fetch:all
      - task: analyze:all
      - task: data:export-status

  data:validate:
    desc: Validate canonical data platform configuration
    cmd: uv run crew-data validate-config

  data:test:
    desc: Run offline data platform contract tests
    cmd: uv run pytest tests/data_platform -q

  data:sync:
    desc: Sync all enabled canonical primary sources
    cmd: uv run crew-data sync

  data:sync:public:
    desc: Sync reachable Treasury data and governed source registry
    cmd: >-
      uv run crew-data sync
      --source treasury_yield_curve
      --source governed_manual

  data:sync:registry:
    desc: Materialize the governed source registry without external credentials
    cmd: uv run crew-data sync --source governed_manual

  data:status:
    desc: Show canonical ingestion runs and datasets
    cmd: uv run crew-data status

  data:export-status:
    desc: Export sanitized canonical status for GitHub Pages
    cmd: uv run crew-data export-status

  fetch:all:
    desc: Export all reachable canonical-active use cases from DuckDB
    cmds:
      - task: data:sync
      - task: fetch:yield

  analyze:all:
    desc: Run reachable canonical-active analyses only; governed blocks remain stopped
    aliases: [run]
    cmds:
      - task: analyze:yield

  lint:
    cmd: uv run ruff check . --fix
  format:
    cmd: uv run ruff format .
  sync:
    cmd: uv sync

  fetch:oracle:
    desc: External-runner only — requires reachable SEC EDGAR access
    cmd: uv run python -m crew.oracle.data_pipeline
  analyze:oracle:
    desc: External-runner only — requires a validated SEC snapshot
    cmd: uv run python -m crew.oracle.analysis

  fetch:yield:
    cmd: uv run python -m crew.yields.data_pipeline
  analyze:yield:
    cmd: uv run python -m crew.yields.analysis

  fetch:legendary_investors:
    desc: External-runner only — requires reachable SEC EDGAR access
    cmd: uv run python -m crew.legendary_investors.data_pipeline
  analyze:legendary_investors:
    desc: External-runner only — requires a validated SEC snapshot
    cmd: uv run python -m crew.legendary_investors.analysis

  blocked:sec:
    desc: Governed stop — data.sec.gov rejects GitHub-hosted runners with HTTP 403
    cmd: echo "SEC analyses require a validated reachable external runner; see data-status"
  blocked:credit:
    desc: Governed stop — ICE BofA OAS public redistribution approval is missing
    cmd: echo "credit OAS is intentionally stopped; see data-status"
  blocked:imura:
    desc: Governed stop — official machine-readable NAV contract is missing
    cmd: echo "imura is intentionally stopped; see data-status"
  blocked:etf:
    desc: Governed stop — JPX/EDINET product contract is missing
    cmd: echo "ETF comparisons are intentionally stopped; see data-status"
  blocked:metals:
    desc: Governed stop — LBMA historical data license is missing
    cmd: echo "metals is intentionally stopped; see data-status"
  blocked:loan:
    desc: Governed stop — private contract/account input is required
    cmd: echo "collateral loan live state requires private input; see data-status"
  blocked:semiconductors:
    desc: Governed partial — public WSTS releases only
    cmd: echo "semiconductors is partially available; see data-status"

  serve:
    desc: Run the HTMX web dashboard
    cmd: uv run python web/app.py
